<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="assets/icons/icon.png">
  <meta charset="utf-8">
  <title>Draws — Jeonghoon (June) Park</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/custom.css">

  <style>
    body {
      color: #333;
      font-size: 15px;
      line-height: 1.7;
    }
    .topnav {
      text-align: center;
      padding: 14px 0 6px;
      border-bottom: 1px solid #eee;
      margin-bottom: 0;
    }
    .topnav a {
      color: #555;
      font-size: 14px;
      text-decoration: none;
      margin-left: 4px;
    }
    .topnav a:hover {
      color: #1EAEDB;
    }
    .page-title {
      margin-top: 36px;
      margin-bottom: 24px;
      font-size: 22px;
      font-weight: 600;
    }
    .art-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .art-grid img {
      width: 100%;
      border-radius: 6px;
      display: block;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .art-grid img:hover {
      opacity: 0.85;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    footer {
      margin-top: 40px;
      padding: 16px 0;
      text-align: center;
      font-size: 12px;
      color: #aaa;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="one column hide-on-small">&nbsp;</div>
    <div class="ten columns">

      <div class="topnav">
        She <a href="draws.html"><b>draws</b></a>, <a href="writes.html"><b>writes</b></a>,&ensp;and<a href="captures.html"><b>captures</b></a>
      </div>

      <div class="page-title">Draws</div>

      <div class="art-grid">
        <img src="img/art/art_apple.png" alt="art_apple" onclick="openLightbox(this)">
        <img src="img/art/IMG_0330.PNG" alt="IMG_0330" onclick="openLightbox(this)">
        <img src="img/art/art_eonwed.png" alt="art_eonwed" onclick="openLightbox(this)">
        <img src="img/art/IMG_0387.jpg" alt="IMG_0387" onclick="openLightbox(this)">
      </div>

      <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="">
      </div>

    </div>
    <div class="one column hide-on-small">&nbsp;</div>
  </div>

  <footer>
    2026 © Jeonghoon (June) Park
  </footer>

  <script>
    function openLightbox(img) {
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
